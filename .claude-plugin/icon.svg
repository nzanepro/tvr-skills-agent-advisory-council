<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Advisory Council">
  <title>Advisory Council</title>
  <!-- Tile: the dark navy of the README diagram, with a light rim so it also reads on dark backgrounds -->
