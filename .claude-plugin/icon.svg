    <circle cx="59.2" cy="73.1" r="21"/>
  </g>
  <circle cx="128" cy="40" r="21" fill="#e8aa48"/>
  <circle cx="166.2" cy="207.3" r="21" fill="#d66e6e"/>
</svg>
