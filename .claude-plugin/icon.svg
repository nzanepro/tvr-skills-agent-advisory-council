  <circle cx="128" cy="128" r="54" fill="#222938" stroke="#96a0b2" stroke-width="5"/>
  <rect x="108" y="100" width="40" height="54" rx="6" fill="#eceff4"/>
  <path d="M117 116h22M117 128h22M117 140h14" stroke="#96a0b2" stroke-width="6" stroke-linecap="round"/>
